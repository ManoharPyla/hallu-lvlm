[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hallu"
version = "0.1.0"
description = "Calibrated risk-guided selective hallucination mitigation for LVLMs"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "tqdm>=4.65",
]

[project.optional-dependencies]
model = ["transformers>=4.45", "accelerate>=0.33", "pillow>=10.0", "sentencepiece", "protobuf"]
quant = ["bitsandbytes>=0.43"]
data = ["huggingface_hub>=0.24", "datasets>=2.20"]
demo = ["gradio>=4.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
